<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">

  <title>KAYN — Official</title>
  <meta name="description" content="Official KAYN page — music, socials and contact.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #080808;
      --text: #f4f4f4;
      --muted: #777;
      --line: #242424;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% -20%, #252525 0%, #080808 42%),
        var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
    }

    main {
      width: min(100%, 620px);
      padding: 70px 22px 35px;
    }

    header {
      text-align: center;
      margin-bottom: 52px;
    }

    .logo {
      font-size: clamp(3.8rem, 16vw, 6.7rem);
      font-weight: 900;
      letter-spacing: -0.07em;
      line-height: .9;
    }

    .role {
      margin-top: 18px;
      font-size: .72rem;
      letter-spacing: .35em;
      color: var(--muted);
    }

    .tagline {
      margin-top: 22px;
      font-size: .95rem;
      color: #aaa;
    }

    .section-title {
      margin: 36px 0 13px;
      font-size: .62rem;
      letter-spacing: .3em;
      color: #555;
    }

    .links {
      display: grid;
      gap: 11px;
    }

    .link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 22px;
      background: rgba(16, 16, 16, .82);
      border: 1px solid var(--line);
      border-radius: 5px;
      color: var(--text);
      text-decoration: none;
      font-size: .85rem;
      font-weight: 700;
      letter-spacing: .13em;
      transition: background .2s ease, border-color .2s ease;
    }

    .link:hover {
      background: #171717;
      border-color: #555;
    }

    .link:focus-visible,
    .email:focus-visible {
      outline: 2px solid #aaa;
      outline-offset: 4px;
    }

    .handle {
      display: block;
      margin-top: 5px;
      color: #888;
      font-size: .65rem;
      font-weight: 400;
      letter-spacing: .08em;
    }

    .arrow {
      color: #777;
      font-size: 1.1rem;
    }

    .contact {
      margin-top: 42px;
      padding-top: 25px;
      border-top: 1px solid var(--line);
      text-align: center;
    }

    .contact p {
      color: #888;
      font-size: .7rem;
      letter-spacing: .16em;
      margin-bottom: 12px;
    }

    .email {
      color: #ddd;
      text-decoration: none;
      font-size: .9rem;
      overflow-wrap: anywhere;
    }

    footer {
      text-align: center;
      margin-top: 65px;
      color: #777;
      font-size: .65rem;
      letter-spacing: .16em;
    }
  </style>
</head>

<body>
  <main>

    <header>
      <h1 class="logo">KAYN</h1>
      <div class="role">RAPPER · PRODUCER</div>
      <p class="tagline">turn the noise into something useful.</p>
    </header>

    <div class="section-title">FOLLOW</div>

    <div class="links">

      <a class="link"
         href="https://www.instagram.com/kayn_arch/"
         target="_blank"
         rel="noopener noreferrer">

        <span>
          INSTAGRAM
          <span class="handle">@kayn_arch</span>
        </span>

        <span class="arrow">↗</span>
      </a>

      <a class="link"
         href="https://t.me/kayn_arch"
         target="_blank"
         rel="noopener noreferrer">

        <span>
          TELEGRAM
          <span class="handle">@kayn_arch</span>
        </span>

        <span class="arrow">↗</span>
      </a>

    </div>

    <div class="contact">

      <p>MUSIC · COLLABORATIONS · BUSINESS</p>

      <a class="email"
         href="mailto:han.dohyon000@gmail.com">
        han.dohyon000@gmail.com
      </a>

    </div>

    <footer>
      © 2026 KAYN
    </footer>

  </main>
</body>
</html>
